name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: this workflow only ever reads the repo.
permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug only. Release signing needs the keystore, which lives in Actions
      # secrets and is never available to workflows triggered by forks.
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: shotbuddy-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
