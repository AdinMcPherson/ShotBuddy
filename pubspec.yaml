name: shotbuddy
description: "Open-source, offline-first basketball shot tracker with on-device AI."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
